<div class="container mx-auto p-6">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">Liste des projets</h2>

  <!-- Partie 7 : Two-Way Data Binding avec [(ngModel)] -->
  <div class="mb-6 max-w-md">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      placeholder="Rechercher un projet..."
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
  </div>

  <!-- Partie 8 : Nouvelle syntaxe @for pour afficher les projets -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (project of filteredProjects(); track project.id) {
    <app-project-card
      [project]="project"
      (projectSelected)="onProjectSelected($event)"
    >
    </app-project-card>
    } @empty {
    <p class="text-gray-500 col-span-full">Aucun projet trouvé.</p>
    }
  </div>
</div>
