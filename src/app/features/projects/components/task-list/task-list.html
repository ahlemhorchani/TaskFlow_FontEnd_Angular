<div class="space-y-2">
  <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">
    Tâches ({{ tasks().length }})
  </h4>

  @if (tasks().length === 0) {
  <p class="text-xs text-slate-400 italic py-2">Aucune tâche attribuée à ce projet.</p>
  } @else {
  <div class="space-y-2.5">
    @for (task of tasks(); track task.id) {
    <div
      class="p-3 rounded-r-lg border-y border-r border-slate-100 border-l-4 shadow-2xs flex items-center justify-between gap-3 transition-colors"
      [ngClass]="getTaskStatusClass(task.status)"
    >
      <!-- Titre -->
      <span class="text-sm font-medium leading-tight">
            {{ task.title }}
          </span>

      <!-- Badges de statut et priorité -->
      <div class="flex items-center gap-1.5 shrink-0">
            <span
              class="text-[11px] px-2 py-0.5 rounded-md"
              [ngClass]="getPriorityClass(task.priority)"
            >
              {{ task.priority }}
            </span>
        <span class="text-[11px] font-medium px-2 py-0.5 rounded-md bg-white/80 border border-slate-200/60 shadow-2xs">
              {{ task.status }}
            </span>
      </div>
    </div>
    }
  </div>
  }
</div>
