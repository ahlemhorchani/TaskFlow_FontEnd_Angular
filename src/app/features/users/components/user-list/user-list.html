<div class="space-y-6">
  <div class="space-y-6">
    <!-- En-tête avec le ViewToggle et la recherche -->
    <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
      <h2 class="text-lg font-bold text-gray-800">Gestion des Utilisateurs</h2>

      <!-- Intégration du composant ViewToggle -->
      <app-view-toggle
        [activeView]="currentView()"
        (viewChange)="currentView.set($event)"
      />
    </div>

    <!-- Barre de recherche -->
    <div class="relative">
      <input
        type="text"
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        placeholder="Rechercher un utilisateur par nom, email ou rôle..."
        class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
      />
    </div>

    <!-- Affichage conditionnel selon la vue active -->
    @if (currentView() === 'user') {
    <!-- Liste des cartes utilisateurs -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (user of filteredUsers(); track user.id) {
      <app-user-card
        [user]="user"
        (userSelected)="onUserSelected($event)"
      />
      } @empty {
      <div class="col-span-full">
        <p class="text-center text-gray-500 py-8">Aucun utilisateur trouvé.</p>
      </div>
      }
    </div>
    } @else {
    <!-- Vue "Par tâche" (vous pouvez y mettre votre composant task-list ou autre vue) -->
    <div class="p-6 bg-white rounded-xl border border-gray-200 text-center text-gray-500">
      <p>Vue par tâche active</p>
    </div>
    }
  </div>
