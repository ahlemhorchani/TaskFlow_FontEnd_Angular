<div class="border-l-2 border-indigo-500 pl-3 py-1 space-y-2 bg-gray-50 rounded-r-lg p-3">
  <!-- Nom du projet et nombre de tâches -->
  <div class="flex items-center justify-between">
    <h4 class="text-sm font-bold text-indigo-900">{{ group().projectName }}</h4>
    <span class="text-[10px] font-medium px-2 py-0.5 bg-indigo-100 text-indigo-800 rounded-full">
      {{ group().tasks.length }} tâche(s)
    </span>
  </div>

  <!-- Réutilisation de task-list -->
  <app-task-list
    [tasks]="group().tasks"
  />
</div>
